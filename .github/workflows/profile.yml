name: Profile README

on:
  schedule:
    - cron: "23 9 * * *" # once a day, 06:23 in Fortaleza
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - profile.config.json
      - scripts/**
      - fonts/**
      - profile/covers/**
      - profile/mascot/**
      - .github/workflows/profile.yml

permissions:
  contents: write

concurrency:
  group: profile-readme
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build README and panels
        run: node scripts/build-profile.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if anything changed
        run: |
          git add README.md profile/generated
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(profile): refresh generated README"
          git push
